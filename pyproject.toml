[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "collector-ons-cpi"
version = "0.1.0"
description = "UK Consumer Prices Index collector with official weights and bottom-up validation"
requires-python = ">=3.11"
dependencies = [
  "azure-identity>=1.17",
  "azure-keyvault-secrets>=4.8",
  "databricks-sqlalchemy>=2.0",
  "httpx[socks]>=0.27",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "psycopg2-binary>=2.9",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
